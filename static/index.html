<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Support Agent Demo</title>
<style>
 body{font-family:system-ui,sans-serif;background:#f4f6f9;margin:0;display:flex;justify-content:center}
 .wrap{width:min(720px,100%);height:100vh;display:flex;flex-direction:column;background:#fff;box-shadow:0 0 20px #0001}
 header{padding:14px 18px;background:#1f3a5f;color:#fff;font-weight:600}
 #log{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
 .msg{max-width:80%;padding:9px 13px;border-radius:12px;line-height:1.45;unicode-bidi:plaintext}
 .me{align-self:flex-end;background:#1f3a5f;color:#fff}.bot{align-self:flex-start;background:#eef1f5}
 .meta{font-size:11px;color:#667;margin-top:5px}.handoff{color:#b42318;font-weight:600}
 form{display:flex;gap:8px;padding:12px;border-top:1px solid #e3e6ea}
 input{flex:1;padding:10px;border:1px solid #ccd;border-radius:8px;font-size:15px;unicode-bidi:plaintext}
 button{padding:10px 16px;border:0;border-radius:8px;background:#1f3a5f;color:#fff;cursor:pointer}
</style></head><body><div class="wrap">
<header>Bilingual Support Agent · English / فارسی</header>
<div id="log"></div>
<form id="f"><input id="m" placeholder="Try: where is order 10234?  یا  سفارشم رو لغو کنید" autocomplete="off"><button>Send</button></form>
</div><script>
const sid = Math.random().toString(36).slice(2), log = document.getElementById('log');
function add(text, cls, meta){const d=document.createElement('div');d.className='msg '+cls;d.textContent=text;
 if(meta){const m=document.createElement('div');m.className='meta';m.innerHTML=meta;d.appendChild(m)}
 log.appendChild(d);log.scrollTop=log.scrollHeight}
document.getElementById('f').onsubmit=async e=>{e.preventDefault();const i=document.getElementById('m'),t=i.value.trim();if(!t)return;
 i.value='';add(t,'me');
 const r=await (await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_id:sid,message:t})})).json();
 const tools=r.actions.map(a=>a.tool).join(', ')||'none';
 add(r.reply,'bot',`intent <b>${r.intent}</b> (${r.confidence}) · route <span class="${r.route}">${r.route}</span> · tools: ${tools} · ${r.latency_ms.total} ms`)};
</script></body></html>
